# Paired A/B benchmark of crest builds and options on a set of MIPs: a
# private repository's instances/*.mps.gz (secrets PRIVATE_SUITE_REPO and
# PRIVATE_SUITE_KEY, a read-only deploy key), or the public MIPLIB models
# below (instance globs miplib/*.mps.gz). Run by hand (workflow_dispatch,
# inputs below), or by pushing a branch bench-paired/* whose commit sets the
# defaults in `env`. Seeds x instances are sharded over runners; on each
# runner every (instance, seed) runs all configs back to back, so a pair
# sees the same CPU. Results: the paired-results artifact (JSONL) and the
# run summary (bench/paired.py report). Logs are public: only objectives,
# gaps and times print, and a private model goes by a hash of its name.
name: bench-paired
on:
  push:
    branches: ['bench-paired/**', 'bench-screen/**']
  workflow_dispatch:
    inputs:
      configs:
        description: "Configs, ';'-separated: NAME[@GIT_REF]: option=value ... (the first is the base)"
      instances:
        description: "Instance globs under the private instances/, space-separated (all); miplib/*.mps.gz: the public MIPLIB UC models"
      seeds:
        description: "Seeds (0-15)"
      time_limit:
        description: "Time limit, s (180)"
      threads:
        description: "Threads (1)"
      mip_rel_gap:
        description: "mip_rel_gap (0.01)"
      archs:
        description: "x64, arm64 or both, comma-separated (x64,arm64)"
      shards:
        description: "Runners per architecture (16)"
      parallel:
        description: "Pairs at once on a runner, of 4 vCPUs (1)"
      screen:
        description: "Screening run: the private repository's screen.txt instances, 8 seeds, 120 s, 8 runners per arch, unless set above (bench-screen/* branches too)"
        type: boolean

env:
  CONFIGS: "${{ inputs.configs || 'main@main: ; head:' }}"
  # screen: the instances most sensitive to past changes (the globs of
  # screen.txt in the private repository); a candidate passes it before a
  # full run
  INSTANCES: "${{ inputs.instances || (inputs.screen || startsWith(github.ref, 'refs/heads/bench-screen/')) && '@screen' || '*.mps.gz' }}"
  SEEDS: "${{ inputs.seeds || (inputs.screen || startsWith(github.ref, 'refs/heads/bench-screen/')) && '0-7' || '0-15' }}"
  TIME_LIMIT: "${{ inputs.time_limit || (inputs.screen || startsWith(github.ref, 'refs/heads/bench-screen/')) && '120' || '180' }}"
  THREADS: "${{ inputs.threads || '1' }}"
  GAP: "${{ inputs.mip_rel_gap || '0.01' }}"
  ARCHS: "${{ inputs.archs || 'x64,arm64' }}"
  SHARDS: "${{ inputs.shards || (inputs.screen || startsWith(github.ref, 'refs/heads/bench-screen/')) && '8' || '16' }}"
  PARALLEL: "${{ inputs.parallel || '1' }}"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      builds: ${{ steps.p.outputs.builds }}
      runs: ${{ steps.p.outputs.runs }}
      cfgs: ${{ steps.p.outputs.cfgs }}
      base: ${{ steps.p.outputs.base }}
    steps:
      - id: p
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re
          # ec2: arm64 builds on GitHub, runs on a self-hosted spot runner (bench/ec2_runner.sh)
          runner = {'x64': 'ubuntu-24.04', 'arm64': 'ubuntu-24.04-arm', 'ec2': 'ubuntu-24.04-arm'}
          run_on = dict(runner, ec2='crest-ec2')
          archs = [a.strip() for a in os.environ['ARCHS'].split(',') if a.strip()]
          refs, cfgs = {}, []
          for c in os.environ['CONFIGS'].split(';'):
              if not c.strip():
                  continue
              head, _, opts = c.partition(':')
              nm, _, ref = head.strip().partition('@')
              slug = re.sub(r'[^A-Za-z0-9._-]', '_', ref) if ref else 'head'
              refs[slug] = ref
              cfgs.append(','.join([f'{nm}=bins/{slug}/crest'] + opts.split()))
          print('builds=' + json.dumps([dict(arch=a, runner=runner[a], ref=r, slug=s) for a in archs for s, r in refs.items()]))
          print('runs=' + json.dumps([dict(arch=a, runner=run_on[a], shard=k) for a in archs for k in range(int(os.environ['SHARDS']))]))
          print('cfgs=' + ' '.join(cfgs))
          print('base=' + cfgs[0].split('=')[0])
          EOF
          cat "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
      - uses: dtolnay/rust-toolchain@stable
      # x64: x86-64-v3 as on AWS Lambda (README); arm64: the default target
      - run: |
          if [ "${{ matrix.arch }}" = x64 ]; then
            export RUSTFLAGS="-C llvm-args=-unroll-runtime=false -C target-cpu=x86-64-v3"
          fi
          cargo build --release --bin crest
          mkdir -p out/${{ matrix.slug }} && cp target/release/crest out/${{ matrix.slug }}/
      - uses: actions/upload-artifact@v4
        with:
          name: crest-${{ matrix.arch }}-${{ matrix.slug }}
          path: out

  run:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.runs) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_SUITE_REPO }}
          ssh-key: ${{ secrets.PRIVATE_SUITE_KEY }}
          path: private
      # public MIPLIB 2017 unit commitment and energy models (MIPFEAS):
      # instance globs miplib/*.mps.gz
      - if: contains(env.INSTANCES, 'miplib/')
        run: |
          mkdir -p miplib
          for m in uccase9 unitcal_7 irish-electricity buildingenergy; do
            curl -sfL --retry 3 -o miplib/$m.mps.gz https://miplib.zib.de/WebData/instances/$m.mps.gz
          done
      - uses: actions/download-artifact@v4
        with:
          pattern: crest-${{ matrix.arch }}-*
          path: bins
          merge-multiple: true
      - env:
          CFGS: ${{ needs.plan.outputs.cfgs }}
          SHARD: ${{ matrix.shard }}
          ARCH: ${{ matrix.arch }}
        run: |
          chmod +x bins/*/crest
          [ "$INSTANCES" = @screen ] && INSTANCES=$(tr '\n' ' ' < private/screen.txt)
          inst=(); for g in $INSTANCES; do case $g in miplib/*) inst+=("$g");; *) inst+=("private/instances/$g");; esac; done
          python3 bench/paired.py run results-$ARCH-$SHARD.jsonl \
            --cfg $CFGS --inst "${inst[@]}" --seeds "$SEEDS" --tl "$TIME_LIMIT" \
            --threads "$THREADS" --gap "$GAP" --shard "$SHARD/$SHARDS" -j "$PARALLEL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.arch }}-${{ matrix.shard }}
          path: results-*.jsonl

  report:
    needs: [plan, run]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: res
          merge-multiple: true
      - run: |
          cat res/*.jsonl > paired-results.jsonl
          python3 bench/paired.py report paired-results.jsonl --base ${{ needs.plan.outputs.base }} | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: paired-results
          path: paired-results.jsonl
