name: CI
on:
  push:
    branches-ignore: ['bench-dispatch/**', 'bench-std-run/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: python3 bench/std.py selftest
      - run: cargo build --release --bin crest
      # mip_deterministic: three two-thread runs take the same path
      - name: Deterministic two-thread runs
        run: |
          curl -fL --retry 3 -o neos-911970.mps.gz https://miplib.zib.de/WebData/instances/neos-911970.mps.gz
          printf "threads = 2\nmip_rel_gap = 0.01\nmip_max_nodes = 3000\nmip_deterministic = true\n" > det.opts
          for i in 1 2 3; do
            target/release/crest --options_file det.opts neos-911970.mps.gz > det$i.log 2>&1 || true
            grep -q "helper thread started" det$i.log || { tail -40 det$i.log; echo "no helper"; exit 1; }
            grep -E "^  (Nodes|LP iterations|Primal bound)" det$i.log > det$i.txt || true
            cat det$i.txt
          done
          [ -s det1.txt ] && cmp det1.txt det2.txt && cmp det1.txt det3.txt

  # crest against the C++ highs app of a pinned HiGHS commit (gcc, no FMA
  # contraction): outputs must match (bench/quick_check.sh)
  oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: asross/HiGHS
          ref: 9b1bb74466f6ee7c353a877f7a6cb907f2e686f9
          path: highs-cpp
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the C++ highs app
        run: |
          cmake -S highs-cpp -B build-cpp -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_FLAGS=-ffp-contract=off -DCMAKE_CXX_FLAGS=-ffp-contract=off \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
          cmake --build build-cpp --parallel 4 --target highs-bin
      - run: cargo build --release --bin crest --features "libstdcxx no_fma hyper_dfs"
      - run: HIGHS_DIR=$PWD/highs-cpp bash bench/quick_check.sh build-cpp/bin/highs target/release/crest
      # The build for AWS Lambda (AVX2, FMA): with no_fma (no fused
      # multiply-adds) x86-64-v3 must take the C++ app's paths too
      - name: crest for x86-64-v3 against the C++ app
        run: |
          RUSTFLAGS="-C llvm-args=-unroll-runtime=false -C target-cpu=x86-64-v3" \
            cargo build --release --bin crest --features "libstdcxx no_fma hyper_dfs"
          HIGHS_DIR=$PWD/highs-cpp bash bench/quick_check.sh build-cpp/bin/highs target/release/crest
