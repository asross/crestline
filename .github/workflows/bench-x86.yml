# Speed on native x86_64 (run by hand, or by pushing to the bench-x86
# branch): crest against the C++ highs app of
# the oracle's pinned HiGHS commit, and crest built for x86-64-v3 (AVX2,
# as on AWS Lambda) against the generic x86_64 build. bench/perf.py, CPU
# time, minimum of 3 alternating runs; shared runners, so ±3% is noise.
name: bench-x86
on:
  workflow_dispatch:
  push:
    branches: [bench-x86]

jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: asross/HiGHS
          ref: 9b1bb74466f6ee7c353a877f7a6cb907f2e686f9
          path: highs-cpp
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the C++ highs app
        run: |
          cmake -S highs-cpp -B build-cpp -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_FLAGS=-ffp-contract=off -DCMAKE_CXX_FLAGS=-ffp-contract=off \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
          cmake --build build-cpp --parallel 4 --target highs-bin
      - name: Build crest (generic x86_64 and x86-64-v3)
        run: |
          cargo build --release --bin crest --features "libstdcxx no_fma"
          cp target/release/crest crest-generic
          # RUSTFLAGS replaces .cargo/config.toml's flags: repeat them
          RUSTFLAGS="-C llvm-args=-unroll-runtime=false -C target-cpu=x86-64-v3" \
            cargo build --release --bin crest --features "libstdcxx no_fma"
          cp target/release/crest crest-v3
      - name: MIPLIB instances
        run: |
          mkdir miplib
          for m in air04 air05 neos17 nu25-pr12 neos-911970 rail507 co-100 neos-5052403-cygnet; do
            curl -sfL -o miplib/$m.mps.gz https://miplib.zib.de/WebData/instances/$m.mps.gz || true
          done
          ls -la miplib
      - name: crest against the C++ app
        run: HIGHS_DIR=$PWD/highs-cpp python3 bench/perf.py build-cpp/bin/highs ./crest-generic --reps 3 --miplib miplib
      - name: x86-64-v3 against generic
        run: HIGHS_DIR=$PWD/highs-cpp python3 bench/perf.py ./crest-generic ./crest-v3 --reps 3 --miplib miplib
